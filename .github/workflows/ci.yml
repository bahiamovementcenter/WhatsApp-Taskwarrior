name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: third_party/whatsapp-mcp/whatsapp-bridge/go.sum
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y shellcheck shfmt taskwarrior just
      - run: uv sync
      - run: just lint
      - run: just test
      - run: just bridge-build
