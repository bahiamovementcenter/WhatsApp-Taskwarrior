[project]
name = "whatsapp-taskwarrior"
version = "0.1.0"
description = "Bridge WhatsApp messages to Taskwarrior via whatsapp-mcp"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
wtw = "whatsapp_taskwarrior.cli:main"
wtw-apply = "whatsapp_taskwarrior.cli:apply_main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/whatsapp_taskwarrior"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["third_party"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
